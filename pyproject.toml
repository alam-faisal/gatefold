[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gatefold"
version = "0.3.1"
description = "Framework-agnostic quantum circuit diagram plotting with matplotlib"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Faisal Alam", email = "mfalam2@illinois.edu" }]
keywords = ["quantum", "quantum-computing", "circuit-diagram", "matplotlib", "visualization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/alam-faisal/gatefold"
Repository = "https://github.com/alam-faisal/gatefold"
Issues = "https://github.com/alam-faisal/gatefold/issues"

[project.optional-dependencies]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/gatefold"]

[tool.ruff]
line-length = 120
